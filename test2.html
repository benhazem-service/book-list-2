<!DOCTYPE html>
<html dir="rtl">
<head>
<style>
.two-cols {
  column-count: 2;
  column-gap: 20px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
td, th {
  border: 1px solid black;
  padding: 4px;
}
tr {
  break-inside: avoid;
  page-break-inside: avoid;
}
</style>
</head>
<body>
<div class="two-cols">
  <table>
    <tr><th>Book</th><th>Qty</th></tr>
    <tr><td>Book 1</td><td>1</td></tr>
    <tr><td>Book 2</td><td>1</td></tr>
    <tr><td>Book 3</td><td>1</td></tr>
    <tr><td>Book 4</td><td>1</td></tr>
    <tr><td>Book 5</td><td>1</td></tr>
    <tr><td>Book 6</td><td>1</td></tr>
    <tr><td>Book 7</td><td>1</td></tr>
    <tr><td>Book 8</td><td>1</td></tr>
    <tr><td>Book 9</td><td>1</td></tr>
    <tr><td>Book 10</td><td>1</td></tr>
  </table>
</div>
</body>
</html>
